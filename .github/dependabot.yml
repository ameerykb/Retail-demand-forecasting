# GitHub opens pull requests when a pinned dependency has an update or a security fix.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: monthly }
    groups:
      python-packages: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: monthly }
