name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU-only PyTorch (much smaller than the default build)
        run: pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Scripts run end to end (synthetic data)
        run: |
          python -m scripts.train_final --synthetic
          python -m scripts.baselines
      - name: Run tests
        run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train a model on synthetic data
        run: |
          pip install -r requirements-api.txt
          python -m scripts.train_final --synthetic
      - name: Build the image
        run: docker build -t demand-forecast-api .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 -v "$PWD/models:/app/models:ro" demand-forecast-api
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 2; done
          curl -f http://localhost:8000/model-info
          curl -f "http://localhost:8000/forecast/1/default?n_days=7"
      - name: Show container logs on failure
        if: failure()
        run: docker logs api

  lambda-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train a model on synthetic data
        run: |
          pip install -r requirements-api.txt
          python -m scripts.train_final --synthetic
      - name: Build the Lambda image
        run: docker build -f Dockerfile.lambda -t demand-forecast-lambda .
      - name: Smoke test with the Lambda Runtime Interface Emulator
        run: |
          # The AWS base image ships the emulator: it exposes the Lambda "invoke" API on port 8080
          docker run -d --name fn -p 9000:8080 -e MODEL_DIR=/models/forecaster \
            -v "$PWD/models:/models:ro" demand-forecast-lambda
          URL=http://localhost:9000/2015-03-31/functions/function/invocations
          for i in $(seq 1 30); do curl -fs -o /dev/null -d '{}' "$URL" && break; sleep 2; done
          for ev in health forecast_default; do
            out=$(curl -fs -d @infra/events/$ev.json "$URL")
            echo "$ev -> $out"
            [ "$(echo "$out" | jq .statusCode)" = "200" ]
          done
          curl -fs -d @infra/events/forecast_default.json "$URL" | jq -e '.body | fromjson | .forecasts | length == 7'
      - name: Show container logs on failure
        if: failure()
        run: docker logs fn

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate
